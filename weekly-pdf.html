<!--
  This is the PRODUCTION file yuanta-wealth-theme/templates/weekly-pdf.html, adapted only
  where it cannot run standalone in a browser. Changes made, marked "[POC]" in comments:

  1. `hubdb_table_rows(2681727733, "week_slug__eq=" ~ week_slug)` -> a Supabase fetch on the
     `weekly_pdf` table, filtered by the same `?week=` query param convention as every other page.
  2. Production gates this page behind HubSpot's membership/SSO login (a page-level access
     setting in HubSpot, not template code — the template itself has no visible gate logic).
     The Supabase PoC has no auth layer at all, so this page just loads/redirects directly,
     per the agreed decision to drop the SSO requirement.
  3. `row.title` doesn't exist as a migrated column on `weekly_pdf` (the Supabase table only
     carries path/hs_name/week_slug/pdf_url) — falls back to `hs_name`, which is byte-identical
     in practice since this table's `hs_name` mirrors `week_slug`.
  4. Logo/`standard_header_includes`/`standard_footer_includes` -> real CDN logo URL / dropped
     (HubSpot analytics boilerplate, no equivalent needed).
  5. This template has no site nav/footer in production either (a standalone redirect/popup
     page, not `{% extends "./layouts/base.html" %}`) — kept that way here for fidelity.
-->
<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weekly Report — Supabase PoC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans Thai', sans-serif; background: #0c244a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .popup-card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    margin: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.35);
  }
  .popup-logo { height: 40px; width: auto; margin-bottom: 32px; }
  .popup-spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(12,36,74,.1);
    border-top-color: #0c244a;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .popup-label { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 600; color: #8f9aac; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }
  .popup-title { font-size: 18px; font-weight: 700; color: #0c244a; line-height: 1.5; margin-bottom: 8px; }
  .popup-sub { font-size: 15px; color: #8f9aac; }

  /* error state */
  .popup-error-icon { color: #c0392b; margin-bottom: 20px; }
  .popup-error-title { font-size: 20px; font-weight: 700; color: #0c244a; margin-bottom: 10px; }
  .popup-error-desc { font-size: 15px; color: #8f9aac; line-height: 1.7; }
  .popup-countdown { font-size: 14px; color: #b4bbc7; margin-top: 24px; }
</style>
</head>
<body>

<div class="popup-card" id="loadCard" style="display:none;">
  <img class="popup-logo" src="https://landing.yuanta.co.th/hubfs/Logo-1.png" alt="Yuanta Wealth"/>
  <div class="popup-spinner"></div>
  <p class="popup-label">Weekly Report</p>
  <p class="popup-title" id="loadTitle"></p>
  <p class="popup-sub">กำลังเปิดเอกสาร…</p>
</div>

<div class="popup-card" id="errorCard" style="display:none;">
  <img class="popup-logo" src="https://landing.yuanta.co.th/hubfs/Logo-1.png" alt="Yuanta Wealth"/>
  <div class="popup-error-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <p class="popup-error-title">ไม่มีบทวิเคราะห์</p>
  <p class="popup-error-desc">ยังไม่มีบทวิเคราะห์สำหรับสัปดาห์นี้<br>กำลังกลับไปหน้าหลัก…</p>
  <p class="popup-countdown" id="countdown"></p>
</div>

<script>
  var SUPABASE_URL = 'https://kqgdvpqygepvaifzrxki.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_6khmxt87r-YGlSxyF9d9XA_G0NNDTbp';
  function sbFetch(table, query) {
    return fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + query, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
    }).then(function (r) { return r.json(); }).catch(function () { return []; });
  }

  function showError() {
    document.getElementById('errorCard').style.display = '';
    var secs = 8;
    var el = document.getElementById('countdown');
    function tick() {
      if (el) el.textContent = secs + '…';
      if (secs <= 0) {
        window.location.href = '/wealth-insights';
        return;
      }
      secs--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function showLoading(row) {
    document.getElementById('loadCard').style.display = '';
    document.getElementById('loadTitle').textContent = row.hs_name || row.week_slug || '';
    var pdfUrl = row.pdf_url && row.pdf_url.url;
    if (!pdfUrl) { showError(); return; }
    setTimeout(function() {
      var ext = pdfUrl.split('?')[0].split('.').pop().toLowerCase();
      if (ext === 'pptx' || ext === 'ppt') {
        window.location.href = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(pdfUrl);
      } else {
        window.location.href = pdfUrl;
      }
    }, 1500);
  }

  var week = new URLSearchParams(location.search).get('week');
  if (week) {
    sbFetch('weekly_pdf', 'select=*&week_slug=eq.' + encodeURIComponent(week) + '&limit=1').then(function(rows) {
      if (rows.length) showLoading(rows[0]); else showError();
    });
  } else {
    showError();
  }
</script>
</body>
</html>
